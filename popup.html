<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Pro Toolkit</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="stylesheet" href="css/tree-view.css" />
</head>
<body class="popup-body">
  <div class="popup-header">
    <div class="popup-brand">
      <div class="brand-icon" style="width: 24px; height: 24px;">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width: 14px; height: 14px;">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="popup-title">XML Pro</span>
    </div>

    <div class="popup-actions-top">
      <button type="button" id="btn-popup-open-full" class="btn-open-studio" title="Open full studio in a new tab">
        Full Studio
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
          <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
        </svg>
      </button>
      <button type="button" id="btn-popup-theme" class="btn-icon theme-toggle-btn" title="Toggle theme">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="popup-toolbar">
    <div class="toolbar-group">
      <button type="button" id="btn-popup-format" class="btn-sm">Format</button>
      <button type="button" id="btn-popup-minify" class="btn-sm">Minify</button>
      <button type="button" id="btn-popup-validate" class="btn-sm">Validate</button>
    </div>
    <div class="toolbar-group">
      <button type="button" id="btn-popup-copy" class="btn-sm">Copy</button>
      <button type="button" id="btn-popup-clear" class="btn-sm">Clear</button>
    </div>
  </div>

  <div class="popup-tabs">
    <button type="button" class="tab-btn active" data-tab="editor">Editor</button>
    <button type="button" class="tab-btn" data-tab="tree">Tree View</button>
    <button type="button" class="tab-btn" data-tab="json">JSON</button>
  </div>

  <div class="popup-content">
    <div id="popup-pane-editor" class="tab-pane active" style="height: 100%;">
      <textarea id="popup-xml-input" class="popup-textarea" placeholder="Paste XML here to format, minify, or convert..."></textarea>
    </div>

    <div id="popup-pane-tree" class="tab-pane" style="height: 100%;">
      <div id="popup-tree-container" class="popup-preview"></div>
    </div>

    <div id="popup-pane-json" class="tab-pane" style="height: 100%;">
      <textarea id="popup-json-output" class="popup-textarea" readonly placeholder="Converted JSON will appear here..."></textarea>
    </div>
  </div>

  <div class="popup-status-bar">
    <span id="popup-status-badge" class="val-badge val-badge-empty">Ready</span>
    <span id="popup-size-info">0 B</span>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
