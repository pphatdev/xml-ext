<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Pro Toolkit</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/popup.css" />
  <link rel="icon" type="image/x-icon" href="fav.ico" />
  <link rel="shortcut icon" href="fav.ico" />
</head>

<body class="popup-body">
  <!-- Brand Header -->
  <header class="popup-header">
    <div class="popup-brand">
      <div class="brand-icon">
        <img src="fav.ico" class="brand-logo-img" alt="XML Pro Logo" width="20" height="20" />
      </div>
      <div class="brand-title-wrap">
        <span class="popup-title">XML Pro</span>
        <span class="brand-badge">v1.0</span>
      </div>
    </div>

    <!-- Top Action Icons -->
    <div class="popup-actions-top">
      <a href="docs.html" target="_blank" class="btn-icon" title="Documentation" aria-label="Documentation">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path
            d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804V12a1 1 0 11-2 0V4.804z" />
        </svg>
      </a>
      <button type="button" id="btn-popup-theme" class="btn-icon theme-toggle-btn" title="Toggle Dark/Light Theme"
        aria-label="Toggle Theme">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z" />
        </svg>
      </button>
    </div>
  </header>

  <!-- Extension Power / Enable-Disable Switch Banner -->
  <section class="popup-power-banner" id="popup-power-banner" aria-label="Extension Status">
    <div class="power-banner-left">
      <span class="power-status-dot active" id="popup-power-dot"></span>
      <div class="power-banner-text">
        <span class="power-title" id="popup-power-title">Extension Enabled</span>
        <span class="power-subtitle" id="popup-power-subtitle">Auto-formats XML documents in browser</span>
      </div>
    </div>
    <div class="power-banner-right">
      <label class="power-toggle-switch" title="Toggle Extension On or Off" aria-label="Toggle Extension">
        <input type="checkbox" id="popup-power-checkbox" checked />
        <span class="power-toggle-slider"></span>
      </label>
    </div>
  </section>

  <!-- Main Popup Hub Content -->
  <main class="popup-hub-body">
    <!-- Active Tab XML Status Card -->
    <div class="popup-tab-status-card" id="popup-tab-card">
      <div class="tab-card-header">
        <span class="tab-card-label" id="tab-card-label">Active Tab</span>
        <span class="tab-card-badge" id="tab-card-badge">Scanning...</span>
      </div>
      <div class="tab-card-url" id="tab-card-url">Checking active page...</div>
      <div class="tab-card-actions" id="tab-card-actions">
        <button type="button" id="btn-tab-open-studio" class="btn-primary btn-sm flex-1"
          title="Open in full XML Pro Studio">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-sm icon icon-tabler icons-tabler-outline icon-tabler-cash-edit">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <path d="M7 15h-3a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v3" />
            <path d="M11 19h-3a1 1 0 0 1 -1 -1v-8a1 1 0 0 1 1 -1h12a1 1 0 0 1 1 1v1.25" />
            <path d="M18.42 15.61a2.1 2.1 0 1 1 2.97 2.97l-3.39 3.42h-3v-3l3.42 -3.39" />
          </svg>
          <span id="btn-tab-open-studio-text">Open XML Studio</span>
        </button>
        <button type="button" id="btn-tab-open-sidepanel" class="btn-secondary btn-sm" title="Inspect in Side Panel">
          <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
            <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v12a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm10 2v8h2V6h-2z" />
          </svg>
          <span>Side Panel</span>
        </button>
      </div>
    </div>

    <!-- Quick Tools Grid Section -->
    <div class="popup-quick-section">
      <div class="section-label">Quick Tools</div>
      <div class="quick-tools-grid">
        <!-- 1. Copy as TXT format -->
        <button type="button" class="quick-tool-btn" id="btn-copy-txt" data-format="txt"
          title="Convert XML and copy as TXT format">
          <div class="tool-icon-wrap tool-icon-txt">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <div class="tool-info">
            <span class="tool-title">Copy as TXT</span>
            <span class="tool-desc">Plain outline tree</span>
          </div>
        </button>

        <!-- 2. Copy as XML Format -->
        <button type="button" class="quick-tool-btn" id="btn-copy-xml" data-format="xml"
          title="Prettify and copy as XML Format">
          <div class="tool-icon-wrap tool-icon-xml">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <div class="tool-info">
            <span class="tool-title">Copy as XML</span>
            <span class="tool-desc">Formatted & indented</span>
          </div>
        </button>

        <!-- 3. Copy as Markdown Format -->
        <button type="button" class="quick-tool-btn" id="btn-copy-md" data-format="markdown"
          title="Convert XML and copy as Markdown Format">
          <div class="tool-icon-wrap tool-icon-md">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-markdown">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" />
              <path d="M7 15v-6l2 2l2 -2v6" />
              <path d="M14 13l2 2l2 -2m-2 2v-6" />
            </svg>
          </div>
          <div class="tool-info">
            <span class="tool-title">Copy as MD</span>
            <span class="tool-desc">Tables & outlines</span>
          </div>
        </button>

        <!-- 4. Copy as JSON -->
        <button type="button" class="quick-tool-btn" id="btn-copy-json" data-format="json"
          title="Convert and copy as JSON">
          <div class="tool-icon-wrap tool-icon-json">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-braces">
              <path stroke="none" d="M0 0h24v24H0z" fill="none" />
              <path d="M7 4a2 2 0 0 0 -2 2v3a2 3 0 0 1 -2 3a2 3 0 0 1 2 3v3a2 2 0 0 0 2 2" />
              <path d="M17 4a2 2 0 0 1 2 2v3a2 3 0 0 0 2 3a2 3 0 0 0 -2 3v3a2 2 0 0 1 -2 2" />
            </svg>
          </div>
          <div class="tool-info">
            <span class="tool-title">Copy as JSON</span>
            <span class="tool-desc">Clean object structure</span>
          </div>
        </button>

        <!-- 5. Copy as CSV -->
        <button type="button" class="quick-tool-btn" id="btn-copy-csv" data-format="csv"
          title="Convert XML and copy as CSV">
          <div class="tool-icon-wrap tool-icon-csv">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M5 4a1 1 0 00-2 0v12a1 1 0 002 0V4zm5 0a1 1 0 00-2 0v12a1 1 0 002 0V4zm5 0a1 1 0 00-2 0v12a1 1 0 002 0V4zM2 7a1 1 0 100 2h16a1 1 0 100-2H2zm0 6a1 1 0 100 2h16a1 1 0 100-2H2z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <div class="tool-info">
            <span class="tool-title">Copy as CSV</span>
            <span class="tool-desc">Tabular dataset</span>
          </div>
        </button>

        <!-- 6. Copy as Yaml -->
        <button type="button" class="quick-tool-btn" id="btn-copy-yaml" data-format="yaml"
          title="Convert XML and copy as Yaml">
          <div class="tool-icon-wrap tool-icon-yaml">
            <svg viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd"
                d="M3 4a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1V4zm8 0a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1V4zm-8 8a1 1 0 011-1h3a1 1 0 011 1v3a1 1 0 01-1 1H4a1 1 0 01-1-1v-3zm7.5-6H10v8h1.5a1 1 0 110 2h-4a1 1 0 110-2H9V6h-.5a1 1 0 010-2h3a1 1 0 010 2z"
                clip-rule="evenodd" />
            </svg>
          </div>
          <div class="tool-info">
            <span class="tool-title">Copy as Yaml</span>
            <span class="tool-desc">Indented document</span>
          </div>
        </button>
      </div>
    </div>
  </main>

  <!-- Compact Shortcuts Footer -->
  <footer class="popup-hub-footer">
    <div class="footer-shortcuts">
      <span class="shortcut-item"><kbd>Alt+1</kbd> Tree</span>
      <span class="shortcut-item"><kbd>Alt+2</kbd> Chart</span>
      <span class="shortcut-item"><kbd>Alt+3</kbd> Raw</span>
    </div>
  </footer>

  <!-- Toast Notification -->
  <div class="popup-toast" id="popup-toast"></div>

  <script type="module" src="popup.js"></script>
</body>

</html>
