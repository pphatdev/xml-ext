<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Pro Side Panel</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/tree-view.css" />
  <link rel="stylesheet" href="css/chart.css" />
  <style>
    body {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .sidepanel-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidepanel-toolbar {
      padding: 0.5rem 0.75rem;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .sidepanel-tabs {
      display: flex;
      gap: 0.25rem;
      padding: 0.35rem 0.75rem;
      background-color: var(--bg-secondary);
      border-bottom: 1px solid var(--border-color);
      overflow-x: auto;
    }
    .sidepanel-pane {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
  </style>
</head>
<body>
  <header class="app-header" style="padding: 0.5rem 0.75rem;">
    <div class="brand-group">
      <div class="brand-icon" style="width: 26px; height: 26px;">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width: 16px; height: 16px;">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="brand-name" style="font-size: 1rem;">XML Pro Panel</span>
    </div>

    <div class="header-right">
      <a href="docs.html" target="_blank" class="btn-sm" title="Documentation" style="text-decoration: none; color: var(--text-normal); display: inline-flex; align-items: center; gap: 0.3rem;">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
        </svg>
        Docs
      </a>
      <button type="button" id="btn-sidepanel-full" class="btn-sm" title="Open Full Studio in Tab">
        Expand
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path d="M11 3a1 1 0 100 2h2.586l-6.293 6.293a1 1 0 101.414 1.414L15 6.414V9a1 1 0 102 0V4a1 1 0 00-1-1h-5z"/>
          <path d="M5 5a2 2 0 00-2 2v8a2 2 0 002 2h8a2 2 0 002-2v-3a1 1 0 10-2 0v3H5V7h3a1 1 0 000-2H5z"/>
        </svg>
      </button>
      <button type="button" id="btn-sidepanel-theme" class="btn-icon theme-toggle-btn" title="Toggle Theme">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"/>
        </svg>
      </button>
    </div>
  </header>

  <div class="sidepanel-toolbar">
    <div class="toolbar-group">
      <button type="button" id="btn-sp-format" class="btn-sm">Format</button>
      <button type="button" id="btn-sp-minify" class="btn-sm">Minify</button>
      <button type="button" id="btn-sp-validate" class="btn-sm">Validate</button>
    </div>
    <div class="toolbar-group">
      <button type="button" id="btn-sp-copy" class="btn-sm">Copy</button>
      <button type="button" id="btn-sp-sitemap" class="btn-primary btn-sm">Sitemap</button>
    </div>
  </div>

  <div class="sidepanel-tabs">
    <button type="button" class="tab-btn active" data-view="editor">Editor</button>
    <button type="button" class="tab-btn" data-view="tree">Tree</button>
    <button type="button" class="tab-btn" data-view="converter">Convert</button>
    <button type="button" class="tab-btn" data-view="linter">Linter</button>
    <button type="button" class="tab-btn" data-view="analyzer">Analyzer</button>
  </div>

  <main class="sidepanel-container">
    <div id="sp-pane-editor" class="sidepanel-pane"></div>
    <div id="sp-pane-tree" class="sidepanel-pane hidden"></div>
    <div id="sp-pane-converter" class="sidepanel-pane hidden"></div>
    <div id="sp-pane-linter" class="sidepanel-pane hidden"></div>
    <div id="sp-pane-analyzer" class="sidepanel-pane hidden"></div>
  </main>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
