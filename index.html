<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Pro Toolkit — Editor, Linter, Tree, Converter & Sitemap Generator</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/tree-view.css" />
  <link rel="stylesheet" href="css/chart.css" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-group">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <span class="brand-name">XML Pro Studio</span>
          <span class="brand-badge">Extension</span>
        </div>
      </div>
    </div>

    <div class="header-center">
      <div id="validation-badge" class="val-badge val-badge-empty" title="Validation status">Empty</div>
    </div>

    <div class="header-right">
      <button type="button" id="btn-theme-toggle" class="btn-icon theme-toggle-btn" title="Toggle Dark/Light Theme">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Action Toolbar -->
  <nav class="action-toolbar">
    <div class="toolbar-group">
      <!-- Samples Picker -->
      <select id="select-sample" class="select-sm" title="Load sample XML dataset">
        <option value="" disabled selected>Sample Templates...</option>
        <option value="catalog">Book Catalog (Hierarchical)</option>
        <option value="sitemap">Google Sitemap (urlset)</option>
        <option value="rss">RSS 2.0 News Feed</option>
        <option value="svg">SVG Vector Graphic</option>
        <option value="pom">Maven pom.xml Config</option>
        <option value="soap">SOAP 1.2 Web Service</option>
      </select>

      <div class="toolbar-divider"></div>

      <!-- Load from URL & Load from Files -->
      <button type="button" id="btn-load-url" class="btn-secondary" title="Fetch XML from an online URL">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.586 4.586a2 2 0 112.828 2.828l-3 3a2 2 0 01-2.828 0 1 1 0 00-1.414 1.414 4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5a1 1 0 101.414 1.414l1.5-1.5zm-5 5a2 2 0 012.828 0 1 1 0 101.414-1.414 4 4 0 00-5.656 0l-3 3a4 4 0 105.656 5.656l1.5-1.5a1 1 0 10-1.414-1.414l-1.5 1.5a2 2 0 11-2.828-2.828l3-3z" clip-rule="evenodd"/>
        </svg>
        Load URL
      </button>

      <button type="button" id="btn-load-file" class="btn-secondary" title="Upload XML, JSON, or TXT file">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
        </svg>
        Upload File
      </button>
      <input type="file" id="file-input" class="hidden" accept=".xml,.rss,.atom,.svg,.json,.txt,.xsd,.wsdl" />

      <div class="toolbar-divider"></div>

      <!-- Core Operations -->
      <button type="button" id="btn-format" class="btn-secondary" title="Format / Prettify XML (Alt+Shift+F)">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
        </svg>
        Format
      </button>

      <button type="button" id="btn-minify" class="btn-secondary" title="Minify XML (strip redundant whitespace and comments)">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
        </svg>
        Minify
      </button>

      <button type="button" id="btn-validate" class="btn-secondary" title="Validate XML well-formedness">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
        </svg>
        Validate
      </button>

      <button type="button" id="btn-sitemap-gen" class="btn-primary" title="Open Sitemap Generator">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.332 8.027a6.012 6.012 0 011.912-2.706C6.512 5.73 6.974 6 7.5 6A1.5 1.5 0 019 7.5V8a2 2 0 004 0 2 2 0 011.523-1.943A5.977 5.977 0 0116 10c0 .34-.028.675-.083 1H15a2 2 0 00-2 2v2.197A5.973 5.973 0 0110 16v-.2c0-1.402-.555-2.673-1.453-3.6A4.98 4.98 0 007.5 10H6a2 2 0 01-1.668-1.973z" clip-rule="evenodd"/>
        </svg>
        Sitemap Generator
      </button>
    </div>

    <div class="toolbar-group">
      <button type="button" id="btn-copy-xml" class="btn-secondary" title="Copy XML to clipboard">Copy</button>
      <button type="button" id="btn-download-xml" class="btn-secondary" title="Download XML file">Download</button>
      <button type="button" id="btn-clear" class="btn-secondary" title="Clear editor">Clear</button>
    </div>
  </nav>

  <!-- Workbench Split Layout -->
  <main class="workbench-layout">
    <!-- Left Pane: Editor -->
    <section class="workbench-pane left-pane">
      <div class="pane-header">
        <span class="pane-title">XML Source Editor</span>
      </div>
      <div class="pane-content" id="editor-container"></div>
    </section>

    <!-- Right Pane: Multi-Format Visualizer & Tools -->
    <section class="workbench-pane right-pane">
      <div class="pane-header">
        <div class="workbench-tabs">
          <button type="button" class="workbench-tab active" data-view="tree">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
            </svg>
            Tree
          </button>
          <button type="button" class="workbench-tab" data-view="chart">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
            </svg>
            Chart
          </button>
          <button type="button" class="workbench-tab" data-view="converter">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm.008 9.057a1 1 0 011.276.61A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101a7.002 7.002 0 01-11.601-2.566 1 1 0 01.61-1.276z" clip-rule="evenodd"/>
            </svg>
            Convert
          </button>
          <button type="button" class="workbench-tab" data-view="linter">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            Linter
          </button>
          <button type="button" class="workbench-tab" data-view="analyzer">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L10 9.586 8.707 8.293a1 1 0 00-1.414 0l-2 2a1 1 0 101.414 1.414L9.586 10l1.293 1.293a1 1 0 001.414 0l3-3z" clip-rule="evenodd"/>
            </svg>
            Analyzer
          </button>
        </div>
      </div>

      <div class="pane-content">
        <div id="tree-view-container" class="view-panel"></div>
        <div id="chart-view-container" class="view-panel hidden"></div>
        <div id="converter-view-container" class="view-panel hidden"></div>
        <div id="linter-view-container" class="view-panel hidden"></div>
        <div id="analyzer-view-container" class="view-panel hidden"></div>
      </div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
