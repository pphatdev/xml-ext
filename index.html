<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XML Pro Toolkit — Editor, Linter, Tree, Converter & Sitemap Generator</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/editor.css" />
  <link rel="stylesheet" href="css/tree-view.css" />
  <link rel="stylesheet" href="css/chart.css" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <div class="brand-group">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <div style="display: flex; align-items: center; gap: 0.4rem;">
          <span class="brand-name">XML Pro Studio</span>
          <span class="brand-badge">Extension</span>
        </div>
      </div>
    </div>

    <div class="header-center">
      <div id="validation-badge" class="val-badge val-badge-empty" title="Validation status">Empty</div>
    </div>

    <div class="header-right">
      <div class="code-theme-picker" title="Code Highlighting Theme">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
        </svg>
        <select id="studio-code-theme-select" class="code-theme-select" aria-label="Code Theme">
          <option value="blog" selected>Theme: Blog</option>
          <option value="github">Theme: GitHub</option>
          <option value="dracula">Theme: Dracula</option>
          <option value="onedark">Theme: One Dark</option>
          <option value="monokai">Theme: Monokai</option>
        </select>
      </div>

      <a href="docs.html" class="btn-secondary btn-sm" title="Documentation & Markdown Notes" style="text-decoration: none;">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path d="M9 4.804A7.968 7.968 0 005.5 4c-1.255 0-2.443.29-3.5.804v10A7.969 7.969 0 015.5 14c1.669 0 3.218.51 4.5 1.385A7.962 7.962 0 0114.5 14c1.255 0 2.443.29 3.5.804v-10A7.968 7.968 0 0014.5 4c-1.255 0-2.443.29-3.5.804V12a1 1 0 11-2 0V4.804z"/>
        </svg>
        Docs
      </a>
      <button type="button" id="btn-theme-toggle" class="btn-icon theme-toggle-btn" title="Toggle Dark/Light Theme">
        <svg class="icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" clip-rule="evenodd"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Action Toolbar -->
  <nav class="action-toolbar">
    <div class="toolbar-group">
      <!-- Samples Picker -->
      <select id="select-sample" class="select-sm" title="Load sample XML dataset">
        <option value="" disabled selected>Sample Templates...</option>
        <option value="ecommerce">E-Commerce Schema (Card Flow)</option>
        <option value="catalog">Book Catalog (Hierarchical)</option>
        <option value="sitemap">Google Sitemap (urlset)</option>
        <option value="rss">RSS 2.0 News Feed</option>
        <option value="svg">SVG Vector Graphic</option>
        <option value="pom">Maven pom.xml Config</option>
        <option value="soap">SOAP 1.2 Web Service</option>
      </select>

      <div class="toolbar-divider"></div>

      <!-- Load from URL & Load from Files -->
      <button type="button" id="btn-load-url" class="btn-secondary" title="Fetch XML from an online URL">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.586 4.586a2 2 0 112.828 2.828l-3 3a2 2 0 01-2.828 0 1 1 0 00-1.414 1.414 4 4 0 005.656 0l3-3a4 4 0 00-5.656-5.656l-1.5 1.5a1 1 0 101.414 1.414l1.5-1.5zm-5 5a2 2 0 012.828 0 1 1 0 101.414-1.414 4 4 0 00-5.656 0l-3 3a4 4 0 105.656 5.656l1.5-1.5a1 1 0 10-1.414-1.414l-1.5 1.5a2 2 0 11-2.828-2.828l3-3z" clip-rule="evenodd"/>
        </svg>
        Load URL
      </button>

      <button type="button" id="btn-load-file" class="btn-secondary" title="Upload XML, JSON, or TXT file">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd"/>
        </svg>
        Upload File
      </button>
      <input type="file" id="file-input" class="hidden" accept=".xml,.rss,.atom,.svg,.json,.txt,.xsd,.wsdl" />

      <div class="toolbar-divider"></div>

      <!-- Core Operations -->
      <div class="split-btn-group" id="format-split-group">
        <button type="button" id="btn-format" class="btn-secondary split-main-btn" title="Format / Prettify XML (Alt+Shift+F)">
          <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h6a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
          </svg>
          Format
        </button>
        <button type="button" id="btn-format-dropdown" class="btn-secondary split-toggle-btn" aria-label="Format Options" title="Format with Entity Options">
          <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clip-rule="evenodd"/>
          </svg>
        </button>
        <div class="dropdown-menu hidden" id="format-dropdown-menu">
          <button type="button" class="dropdown-item" data-entity-mode="auto">
            <span class="dropdown-item-title">Format (Prettify)</span>
            <span class="dropdown-item-desc">Standard indentation &amp; entity preservation</span>
          </button>
          <button type="button" class="dropdown-item" data-entity-mode="named">
            <span class="dropdown-item-title">Format as Named Entities</span>
            <span class="dropdown-item-desc">Escape &amp;, &lt;, &gt;, &quot;, &apos;</span>
          </button>
          <button type="button" class="dropdown-item" data-entity-mode="numeric">
            <span class="dropdown-item-title">Format as Numeric Entities</span>
            <span class="dropdown-item-desc">Escape symbols and non-ASCII as &amp;#160;</span>
          </button>
          <button type="button" class="dropdown-item" data-entity-mode="hex">
            <span class="dropdown-item-title">Format as Hex Entities</span>
            <span class="dropdown-item-desc">Escape symbols and non-ASCII as &amp;#xA0;</span>
          </button>
          <div class="dropdown-divider"></div>
          <button type="button" class="dropdown-item" data-entity-mode="decode">
            <span class="dropdown-item-title">Decode Entities to Text</span>
            <span class="dropdown-item-desc">Restore character references to UTF-8</span>
          </button>
        </div>
      </div>

      <button type="button" id="btn-minify" class="btn-secondary" title="Minify XML (strip redundant whitespace and comments)">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/>
        </svg>
        Minify
      </button>

      <button type="button" id="btn-validate" class="btn-secondary" title="Validate XML well-formedness">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/>
        </svg>
        Validate
      </button>

      <button type="button" id="btn-sitemap-gen" class="btn-primary" title="Open Sitemap Generator">
        <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.332 8.027a6.012 6.012 0 011.912-2.706C6.512 5.73 6.974 6 7.5 6A1.5 1.5 0 019 7.5V8a2 2 0 004 0 2 2 0 011.523-1.943A5.977 5.977 0 0116 10c0 .34-.028.675-.083 1H15a2 2 0 00-2 2v2.197A5.973 5.973 0 0110 16v-.2c0-1.402-.555-2.673-1.453-3.6A4.98 4.98 0 007.5 10H6a2 2 0 01-1.668-1.973z" clip-rule="evenodd"/>
        </svg>
        Sitemap Generator
      </button>
    </div>

    <div class="toolbar-group">
      <button type="button" id="btn-copy-xml" class="btn-secondary" title="Copy XML to clipboard">Copy</button>
      <button type="button" id="btn-download-xml" class="btn-secondary" title="Download XML file">Download</button>
      <button type="button" id="btn-clear" class="btn-secondary" title="Clear editor">Clear</button>
    </div>
  </nav>

  <!-- Mobile Pane Switcher (Small Screens Only) -->
  <div class="mobile-pane-switcher" id="mobile-pane-switcher">
    <button type="button" class="mobile-switch-btn active" data-pane="editor">
      <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
        <path d="M13.586 3.586a2 2 0 112.828 2.828l-.793.793-2.828-2.828.793-.793zM11.379 5.793L3 14.172V17h2.828l8.38-8.379-2.83-2.828z"/>
      </svg>
      XML Editor
    </button>
    <button type="button" class="mobile-switch-btn" data-pane="visualizer">
      <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
        <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
      </svg>
      Visualizer & Tools
    </button>
    <button type="button" class="mobile-switch-btn" data-pane="both">
      <svg class="icon-sm" viewBox="0 0 20 20" fill="currentColor">
        <path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h10a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h10a2 2 0 002-2v-2a2 2 0 00-2-2H5z"/>
      </svg>
      Split
    </button>
  </div>

  <!-- Workbench Split Layout -->
  <main class="workbench-layout" data-mobile-pane="editor">
    <!-- Left Pane: Editor with Multi-Format Support (XML, JSON, YAML, TXT, CSV) -->
    <section class="workbench-pane left-pane">
      <div class="pane-header editor-pane-header">
        <div class="editor-format-tabs" id="editor-format-tabs">
          <button type="button" class="editor-format-tab active" data-format="xml" title="XML Document">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            <span>XML</span>
          </button>
          <button type="button" class="editor-format-tab" data-format="json" title="JSON Object">
            <img src="icons/json.png" class="tab-format-icon" alt="JSON" />
            <span>JSON</span>
          </button>
          <button type="button" class="editor-format-tab" data-format="yaml" title="YAML Document">
            <img src="icons/yaml.png" class="tab-format-icon" alt="YAML" />
            <span>YAML</span>
          </button>
          <button type="button" class="editor-format-tab" data-format="txt" title="Plain Text">
            <img src="icons/txt.png" class="tab-format-icon" alt="TXT" />
            <span>TXT</span>
          </button>
          <button type="button" class="editor-format-tab" data-format="csv" title="CSV Table">
            <img src="icons/csv.png" class="tab-format-icon" alt="CSV" />
            <span>CSV</span>
          </button>
        </div>
        <div class="editor-pane-meta">
          <span class="editor-format-badge" id="editor-active-format-badge">XML</span>
        </div>
      </div>
      <div class="pane-content" id="editor-container"></div>
    </section>

    <!-- Right Pane: Multi-Format Visualizer & Tools -->
    <section class="workbench-pane right-pane">
      <div class="pane-header">
        <div class="workbench-tabs">
          <button type="button" class="workbench-tab active" data-view="tree">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm0 4a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
            </svg>
            Tree
          </button>
          <button type="button" class="workbench-tab" data-view="chart">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
            </svg>
            Chart
          </button>
          <button type="button" class="workbench-tab" data-view="json">
            <img src="icons/json.png" class="tab-format-icon" alt="JSON" />
            JSON
          </button>
          <button type="button" class="workbench-tab" data-view="xml">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M12.316 3.051a1 1 0 01.633 1.265l-4 12a1 1 0 11-1.898-.632l4-12a1 1 0 011.265-.633zM5.707 6.293a1 1 0 010 1.414L3.414 10l2.293 2.293a1 1 0 11-1.414 1.414l-3-3a1 1 0 010-1.414l3-3a1 1 0 011.414 0zm8.586 0a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 11-1.414-1.414L16.586 10l-2.293-2.293a1 1 0 010-1.414z" clip-rule="evenodd"/>
            </svg>
            XML
          </button>
          <button type="button" class="workbench-tab" data-view="csv">
            <img src="icons/csv.png" class="tab-format-icon" alt="CSV" />
            CSV
          </button>
          <button type="button" class="workbench-tab" data-view="yaml">
            <img src="icons/yaml.png" class="tab-format-icon" alt="YAML" />
            YAML
          </button>
          <button type="button" class="workbench-tab" data-view="markdown">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M4 4a2 2 0 00-2 2v8a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2H4zm2 3a1 1 0 00-1 1v4a1 1 0 102 0V9.414l1.293 1.293a1 1 0 001.414 0L12 9.414V12a1 1 0 102 0V8a1 1 0 00-1-1h-.586a1 1 0 00-.707.293L10.5 8.5l-1.207-1.207A1 1 0 008.586 7H6zm9 1a1 1 0 011 1v2.586l.293-.293a1 1 0 111.414 1.414l-2 2a1 1 0 01-1.414 0l-2-2a1 1 0 111.414-1.414l.293.293V9a1 1 0 011-1z" clip-rule="evenodd"/>
            </svg>
            Markdown
          </button>
          <button type="button" class="workbench-tab" data-view="toml">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
            </svg>
            TOML
          </button>
          <button type="button" class="workbench-tab" data-view="txt">
            <img src="icons/txt.png" class="tab-format-icon" alt="TXT" />
            TXT
          </button>
          <div class="workbench-tabs-divider"></div>
          <button type="button" class="workbench-tab" data-view="linter">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M6.267 3.455a3.066 3.066 0 001.745-.723 3.066 3.066 0 013.976 0 3.066 3.066 0 001.745.723 3.066 3.066 0 012.812 2.812c.051.643.304 1.254.723 1.745a3.066 3.066 0 010 3.976 3.066 3.066 0 00-.723 1.745 3.066 3.066 0 01-2.812 2.812 3.066 3.066 0 00-1.745.723 3.066 3.066 0 01-3.976 0 3.066 3.066 0 00-1.745-.723 3.066 3.066 0 01-2.812-2.812 3.066 3.066 0 00-.723-1.745 3.066 3.066 0 010-3.976 3.066 3.066 0 00.723-1.745 3.066 3.066 0 012.812-2.812zm7.44 5.252a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
            </svg>
            Linter
          </button>
          <button type="button" class="workbench-tab" data-view="analyzer">
            <svg class="tab-icon" viewBox="0 0 20 20" fill="currentColor">
              <path fill-rule="evenodd" d="M3 3a1 1 0 000 2v8a2 2 0 002 2h2.586l-1.293 1.293a1 1 0 101.414 1.414L10 15.414l2.293 2.293a1 1 0 001.414-1.414L12.414 15H15a2 2 0 002-2V5a1 1 0 100-2H3zm11.707 4.707a1 1 0 00-1.414-1.414L10 9.586 8.707 8.293a1 1 0 00-1.414 0l-2 2a1 1 0 101.414 1.414L9.586 10l1.293 1.293a1 1 0 001.414 0l3-3z" clip-rule="evenodd"/>
            </svg>
            Analyzer
          </button>
        </div>
      </div>

      <div class="pane-content">
        <div id="tree-view-container" class="view-panel"></div>
        <div id="chart-view-container" class="view-panel hidden"></div>
        <div id="converter-view-container" class="view-panel hidden"></div>
        <div id="linter-view-container" class="view-panel hidden"></div>
        <div id="analyzer-view-container" class="view-panel hidden"></div>
      </div>
    </section>
  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
